        <!-- ปุ่มกดเลื่อนลงไปดูโปรโมชัน -->
        <a href="#promo-section" class="block text-center text-xs text-yellow-300/80 hover:text-yellow-200 underline pt-2 transition">
          👇 คลิกเลื่อนลงไปดูโปรโมชันรูปภาพ
        </a>
      </div>

      <!-- ส่วนแสดงรูปภาพโปรโมชัน -->
      <div id="promo-section" class="mt-6 grid gap-4 grid-cols-1">
        <!-- รูปโปรโมชัน 1 -->
        <a onclick="openModal('images/pro-011.jpg', 'โปรโมชัน 1')" class="promo-card cursor-pointer group relative block rounded-2xl overflow-hidden ring-1 ring-yellow-500/30 bg-white/5 backdrop-blur-sm shadow-[0_0_15px_rgba(255,215,0,0.1)] hover:shadow-[0_0_25px_rgba(255,215,0,0.2)]">
          <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-50"></div>
          <img src="images/pro-011.jpg" alt="โปรโมชัน 1" loading="lazy" class="w-full h-auto opacity-90 group-hover:opacity-100 transition relative z-10">
          <div class="absolute inset-0 pointer-events-none z-20">
            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition bg-gradient-to-tr from-yellow-500/20 via-amber-500/10 to-yellow-400/20"></div>
          </div>
          <div class="absolute bottom-2 right-2 z-30 bg-black/60 backdrop-blur-md text-[10px] text-yellow-300 px-2 py-1 rounded-md opacity-80 group-hover:opacity-100 transition">
            🔍 คลิกเพื่อดูรูปใหญ่
          </div>
        </a>

        <!-- รูปโปรโมชัน 2 -->
        <a onclick="openModal('images/pro-022.jpg', 'โปรโมชัน 2')" class="promo-card cursor-pointer group relative block rounded-2xl overflow-hidden ring-1 ring-yellow-500/30 bg-white/5 backdrop-blur-sm shadow-[0_0_15px_rgba(255,215,0,0.1)] hover:shadow-[0_0_25px_rgba(255,215,0,0.2)]">
          <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-50"></div>
          <img src="images/pro-022.jpg" alt="โปรโมชัน 2" loading="lazy" class="w-full h-auto opacity-90 group-hover:opacity-100 transition relative z-10">
          <div class="absolute inset-0 pointer-events-none z-20">
            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition bg-gradient-to-tr from-yellow-400/20 via-amber-500/10 to-yellow-500/20"></div>
          </div>
          <div class="absolute bottom-2 right-2 z-30 bg-black/60 backdrop-blur-md text-[10px] text-yellow-300 px-2 py-1 rounded-md opacity-80 group-hover:opacity-100 transition">
            🔍 คลิกเพื่อดูรูปใหญ่

  </main>

  <!-- หน้าต่าง Pop-up ดูรูปขนาดเต็ม (Lightbox Modal) -->
  <div id="imageModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/85 backdrop-blur-md transition-opacity duration-300 opacity-0" onclick="closeModal()">
    <div class="relative max-w-2xl w-full p-4 mx-4" onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute -top-10 right-2 text-white text-3xl font-bold hover:text-yellow-400 focus:outline-none transition" title="ปิด">&times;</button>
      <img id="modalImg" src="" alt="ขยายรูปโปรโมชัน" class="w-full h-auto max-h-[80vh] object-contain rounded-xl border border-yellow-500/40 shadow-2xl">
    </div>
  </div>

  <footer class="relative z-10 px-6 pb-8">
    <div class="mx-auto max-w-xl text-center text-[11px] text-white/40">©<span id="year">2026</span> ACE489 All Rights Reserved.</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // ระบบ Lightbox Pop-up เปิด-ปิดรูปภาพ
    function openModal(imgSrc, altText) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = imgSrc;
      modalImg.alt = altText;
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // ปิด Modal เมื่อกดปุ่ม Escape บนคีย์บอร์ด
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // 3D Tilt Effect สำหรับ Promo Cards
    const cards = document.querySelectorAll('.promo-card');
    cards.forEach((card) => {
      card.style.transformStyle = 'preserve-3d';
      card.style.willChange = 'transform';
      card.style.transition = 'transform 0.1s ease-out, box-shadow 0.3s ease';

      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02) translateY(-5px)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1) translateY(0)';
      });
    });

    // Gold Dust Particle Generator
    const dustContainer = document.querySelector('.gold-dust-container') || document.createElement('div');
    if (!document.querySelector('.gold-dust-container')) {
      dustContainer.classList.add('gold-dust-container');
      document.body.insertBefore(dustContainer, document.body.firstChild);
    }

    const particleCount = 40;
    function createParticle() {
      const particle = document.createElement('div');
      particle.classList.add('dust-particle');
      const size = Math.random() * 4 + 2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${Math.random() * 100}vw`;
      particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
      particle.style.animationDelay = `${Math.random() * 10}s`;
      dustContainer.appendChild(particle);
    }

    for (let i = 0; i < particleCount; i++) { createParticle(); }
  </script>
</body>
</html>
